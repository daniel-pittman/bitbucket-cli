# Continuous integration: bash syntax + tooling sanity.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files, each gated by their own posture.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (bb)
        run: bash -n bb

      # The script declares `bash` and `jq` as its only runtime dependencies
      # (README, Requirements section). Ubuntu runners ship both; this step
      # asserts the contract so a future runner-image change that drops
      # either fails CI here rather than silently at user-install time.
      - name: Verify runtime tooling present
        run: |
          command -v bash >/dev/null || { echo "bash missing"; exit 1; }
          command -v jq   >/dev/null || { echo "jq missing";   exit 1; }
          command -v curl >/dev/null || { echo "curl missing"; exit 1; }
          bash --version | head -1
          jq --version
