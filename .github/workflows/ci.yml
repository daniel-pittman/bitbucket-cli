# Continuous integration: bash syntax + Python tests.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files, each gated by their own posture.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Guard the bash 3.2 floor (README + CLAUDE.md advertise "bash 3.2+ —
  # macOS system bash is supported"). `bash -n` on the ubuntu runner uses
  # bash 5.x, which PARSES bash-4-only idioms (${var,,}, mapfile,
  # declare -A, ...) without complaint — they only blow up at runtime
  # under macOS's /bin/bash 3.2. A real such bug (the `${state,,}` in
  # `bb prs`) already shipped once. This job parses bb under an actual
  # bash:3.2 image so the regression class fails CI instead of a user's
  # macOS terminal. Pinned by digest, not tag, per the supply-chain
  # posture (a floating `bash:3.2` tag could be repointed upstream).
  bash32-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse bb under bash 3.2
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            bash:3.2@sha256:a11f59667c0a9d51724e88ebebac74b208f4177e36a33ad80dd23436e70f6115 \
            bash -n bb || {
              echo "bb failed to parse under bash 3.2 — a bash-4+ idiom slipped in." >&2
              echo "Check for \${var,,} / \${var^^} / mapfile / declare -A / etc." >&2
              exit 1
            }

      # Assert the security guards (build_number / pr_id / step_index /
      # count / pr_state) still reject their injection vectors. Runs under
      # the same digest-pinned bash:3.2 image (no jq / curl / git needed —
      # every malicious case is rejected before any external tool). This
      # regression-protects the v1.7.1 token-exfiltration fix: dropping a
      # _require_* call makes a case fail here rather than at release
      # smoke-test time.
      - name: Security-guard assertions under bash 3.2
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            bash:3.2@sha256:a11f59667c0a9d51724e88ebebac74b208f4177e36a33ad80dd23436e70f6115 \
            bash tests/bash/test_security_guards.sh

      # pr-create argument-parsing + stdin no-hang regressions. Unlike the
      # guard harness this one drives the happy path up to (not through) the
      # network, so it needs git + jq and runs on the host runner (which has
      # both) rather than the jq/curl/git-less bash:3.2 image. bash-3.2 PARSE
      # safety of the same code is covered by the "Parse bb under bash 3.2"
      # step above. The no-hang case reproduces the open-pipe-no-EOF stdin
      # that orphaned pr-create and asserts the fix does not block on it.
      - name: pr-create parsing + no-hang regressions (host bash)
        run: bash tests/bash/test_pr_create_parsing.sh

      # API-error reporting + the repo `project` field. Drives bb against a
      # local mock that returns scripted statuses and bodies, so it needs
      # curl + jq + python3 and runs on the host runner. Guards the property
      # that made `curl -sf` a defect: a failed request must print the API's
      # own explanation (including the required/granted scopes on a 403)
      # without leaking the token, and must keep exit 22.
      - name: API-error reporting + repo project (host bash)
        run: bash tests/bash/test_error_reporting.sh

      # `bb members` + `bb pr-create --reviewer`. Guards the contract that
      # makes the pair usable: the UUID the listing prints is the value the
      # flag accepts and sends. Also pins that a name/nickname is rejected
      # locally with ZERO requests issued, so validation can't drift to the
      # API. Needs curl + jq + git + python3, so it runs on the host runner.
      - name: members + pr-create --reviewer (host bash)
        run: bash tests/bash/test_members_and_reviewers.sh

      # `bb pr-update` reviewer changes. The PR PUT REPLACES the reviewers
      # array, so every assertion reads the actual request body: sending
      # only the added person silently unassigns everyone else and still
      # returns 200. Also pins that removing an already-approved reviewer is
      # refused BEFORE the write, since a guard that fires after it is
      # worthless. Needs curl + jq + git + python3.
      - name: pr-update reviewers (host bash)
        run: bash tests/bash/test_pr_update_reviewers.sh

  syntax:
    runs-on: ubuntu-latest
    strategy:
      # Enforce the Python compatibility floor advertised in pyproject.toml
      # (requires-python = ">=3.10"). 3.10 is the floor because bb_api uses
      # PEP 604 union syntax (`X | None`) and PEP 585 builtin generics
      # (`list[str]`) as runtime-resolved annotations; both are 3.10 features.
      # 3.12 catches removed-feature regressions. fail-fast: false so a
      # problem in one version doesn't mask problems in others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (bb)
        run: bash -n bb

      # The script declares `bash` and `jq` as its only runtime dependencies
      # (README, Requirements section). Ubuntu runners ship both; this step
      # asserts the contract so a future runner-image change that drops
      # either fails CI here rather than silently at user-install time.
      - name: Verify runtime tooling present
        run: |
          command -v bash >/dev/null || { echo "bash missing"; exit 1; }
          command -v jq   >/dev/null || { echo "jq missing";   exit 1; }
          command -v curl >/dev/null || { echo "curl missing"; exit 1; }
          bash --version | head -1
          jq --version

      # SHA-pinned actions/setup-python v5.3.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check
        run: python -m py_compile bb_api.py bb_ops.py git_ops.py mcp_server.py

      # Install pytest only. The MCP server's heavy dependencies (mcp) are
      # exercised at runtime, not here — the unit tests mock the network and
      # the MCP transport entirely, so pulling them into CI would just slow
      # the matrix down for no signal.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        run: python -m pytest tests/ -v
